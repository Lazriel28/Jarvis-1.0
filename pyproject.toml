[project]
name = "jarvis-1-0"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pyttsx3>=2.90",
  "SpeechRecognition>=3.14",
  "pyaudio>=0.2.14",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
  "rich>=13.0.0",
  "psutil>=5.7.0",
  "mcp>=1.9,<2",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
